name: Tapnad
options:
  bundleIdPrefix: com.drewmanley
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  P256K:
    url: https://github.com/21-DOT-DEV/swift-secp256k1
    exactVersion: 0.21.1
  CryptoSwift:
    url: https://github.com/krzyzanowskim/CryptoSwift
    from: 1.8.4
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: X9H68STU8F
    CODE_SIGN_STYLE: Automatic
targets:
  Tapnad:
    type: application
    platform: iOS
    sources: [Tapnad]
    dependencies:
      - package: P256K
        product: P256K
      - package: CryptoSwift
    entitlements:
      path: Tapnad/Resources/Tapnad.entitlements
      properties:
        com.apple.developer.nfc.readersession.formats: [NDEF, TAG]
    info:
      path: Tapnad/Resources/Info.plist
      properties:
        CFBundleDisplayName: Tapnad
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NFCReaderUsageDescription: Tap a Tapnad reader to pay.
        NSCameraUsageDescription: Scan a payment QR code.
        NSFaceIDUsageDescription: Confirm payments with Face ID.
        CFBundleURLTypes:
          - CFBundleURLName: com.drewmanley.Tapnad
            CFBundleURLSchemes: [monadpay]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.drewmanley.Tapnad
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
