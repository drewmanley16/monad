<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tapnad Terminal</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
  :root {
    --bg: #07060b; --panel: #121019; --line: #231f30; --text: #f4f2ff; --dim: #8b85a3;
    --purple: #836ef9; --deep: #200052; --green: #2fd36b;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 16px/1.4 -apple-system, "SF Pro Display", Inter, system-ui, sans-serif; min-height: 100vh; }
  .app { display: grid; grid-template-columns: 1fr 360px; min-height: 100vh; }
  main { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px; position: relative; }
  aside { border-left: 1px solid var(--line); padding: 24px; display: flex; flex-direction: column; gap: 20px; overflow: hidden; }
  .brand { position: absolute; top: 24px; left: 32px; display: flex; gap: 10px; align-items: center; font-weight: 700; font-size: 20px; }
  .brand .hex { width: 22px; height: 22px; background: var(--purple); clip-path: polygon(25% 5%,75% 5%,100% 50%,75% 95%,25% 95%,0 50%); }
  .merchant { position: absolute; top: 24px; right: 32px; color: var(--dim); font-size: 14px; cursor: pointer; }
  .screen { display: none; flex-direction: column; align-items: center; gap: 24px; width: 100%; max-width: 520px; }
  .screen.on { display: flex; }

  /* keypad */
  .amount { font-size: 88px; font-weight: 600; letter-spacing: -2px; font-variant-numeric: tabular-nums; }
  .amount small { font-size: 28px; color: var(--dim); margin-left: 8px; }
  .memo { background: var(--panel); border: 1px solid var(--line); color: var(--text); border-radius: 12px; padding: 12px 16px; font-size: 16px; width: 320px; text-align: center; }
  .pad { display: grid; grid-template-columns: repeat(3, 96px); gap: 12px; }
  .pad button { height: 72px; border-radius: 18px; border: 0; background: var(--panel); color: var(--text); font-size: 28px; cursor: pointer; }
  .pad button:active { background: var(--line); }
  .cta { background: var(--purple); color: #fff; border: 0; border-radius: 16px; padding: 18px 48px; font-size: 20px; font-weight: 600; cursor: pointer; width: 320px; }
  .cta:disabled { opacity: .35; cursor: default; }
  .ghost { background: transparent; color: var(--dim); border: 0; font-size: 15px; cursor: pointer; }

  /* waiting */
  .reader { position: relative; width: 220px; height: 220px; display: grid; place-items: center; }
  .reader .ring { position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--purple); animation: ping 1.8s ease-out infinite; }
  .reader .ring:nth-child(2) { animation-delay: .6s; } .reader .ring:nth-child(3) { animation-delay: 1.2s; }
  @keyframes ping { from { transform: scale(.55); opacity: 1 } to { transform: scale(1.15); opacity: 0 } }
  .reader svg { width: 72px; height: 72px; color: var(--purple); }
  .qr { background: #fff; padding: 12px; border-radius: 14px; }
  .qr img { display: block; width: 168px; height: 168px; image-rendering: pixelated; }
  .row { display: flex; gap: 32px; align-items: center; }
  .hint { color: var(--dim); }

  /* success */
  .check { width: 160px; height: 160px; border-radius: 50%; background: var(--green); display: grid; place-items: center; animation: pop .45s cubic-bezier(.2,1.6,.4,1); }
  .check svg { width: 80px; height: 80px; }
  @keyframes pop { from { transform: scale(.3); opacity: 0 } to { transform: scale(1); opacity: 1 } }
  .paid { font-size: 44px; font-weight: 600; }
  .timeline { width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px 20px; }
  .step { display: flex; align-items: center; gap: 12px; padding: 8px 0; color: var(--dim); }
  .step.on { color: var(--text); }
  .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--line); flex: none; }
  .step.on .dot { background: var(--purple); box-shadow: 0 0 12px var(--purple); }
  .step .ms { margin-left: auto; font-variant-numeric: tabular-nums; }

  /* sidebar */
  h3 { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); font-weight: 600; margin-bottom: 10px; }
  .blocks { display: flex; flex-direction: column; gap: 6px; font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; }
  .blk { display: flex; justify-content: space-between; padding: 6px 10px; border-radius: 8px; background: var(--panel); }
  .tag { font-size: 11px; padding: 1px 8px; border-radius: 99px; }
  .Proposed { background: #3a2f00; color: #ffd451; } .Voted { background: #10284a; color: #6bb2ff; }
  .Finalized { background: #0e3320; color: var(--green); } .Verified { background: #2a1f4d; color: #b9a8ff; }
  .feed { display: flex; flex-direction: column; gap: 8px; overflow: auto; }
  .tx { background: var(--panel); border-radius: 10px; padding: 10px 12px; font-size: 14px; display: flex; justify-content: space-between; }
  .tx .who { color: var(--dim); font-size: 12px; font-family: ui-monospace, Menlo, monospace; }
  .stat { display: flex; gap: 12px; }
  .stat div { flex: 1; background: var(--panel); border-radius: 12px; padding: 12px; }
  .stat b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 12px; color: var(--dim); }
  .conn { font-size: 12px; color: var(--dim); }
  .conn i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #c33; margin-right: 6px; }
  .conn.ok i { background: var(--green); }
  dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 16px; padding: 24px; width: 440px; }
  dialog::backdrop { background: #000a; }
  dialog input { width: 100%; margin: 6px 0 14px; background: var(--bg); border: 1px solid var(--line); color: var(--text); border-radius: 10px; padding: 10px; font: 14px ui-monospace, Menlo, monospace; }
  @media (max-width: 900px) { .app { grid-template-columns: 1fr; } aside { border-left: 0; border-top: 1px solid var(--line); } }
</style>
</head>
<body>
<div class="app">
  <main>
    <div class="brand"><div class="hex"></div>tapnad <span style="color:var(--dim);font-weight:500">terminal</span></div>
    <div class="merchant" id="merchantLabel" title="Edit merchant"></div>

    <!-- 1. Enter amount -->
    <section class="screen on" id="s-enter">
      <div class="amount"><span id="amt">0</span><small>MON</small></div>
      <input class="memo" id="memo" placeholder="What's this for?" value="Coffee" />
      <div class="pad" id="pad"></div>
      <button class="cta" id="charge" disabled>Charge</button>
    </section>

    <!-- 2. Waiting for tap -->
    <section class="screen" id="s-wait">
      <div class="amount" id="waitAmt"></div>
      <div class="row">
        <div class="reader">
          <div class="ring"></div><div class="ring"></div><div class="ring"></div>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8.5 7.5a6 6 0 0 1 0 9"/><path d="M12 5a9.5 9.5 0 0 1 0 14"/><path d="M15.5 2.5a13 13 0 0 1 0 19"/></svg>
        </div>
        <div class="qr" id="qr"></div>
      </div>
      <div class="hint">Tap with Tapnad, or scan the code</div>
      <button class="ghost" id="cancel">Cancel</button>
    </section>

    <!-- 3. Paid -->
    <section class="screen" id="s-paid">
      <div class="check"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
      <div class="paid" id="paidAmt"></div>
      <div class="hint" id="paidFrom"></div>
      <div class="timeline" id="timeline"></div>
      <button class="cta" id="next">New Sale</button>
    </section>
  </main>

  <aside>
    <div class="conn" id="conn"><i></i>Connecting to Monad testnet…</div>
    <div class="stat">
      <div><b id="sBlock">—</b><span>Latest block</span></div>
      <div><b id="sBt">—</b><span>Block time</span></div>
    </div>
    <div><h3>Live blocks</h3><div class="blocks" id="blocks"></div></div>
    <div style="flex:1;min-height:0;display:flex;flex-direction:column"><h3>Payments received</h3><div class="feed" id="feed"></div></div>
  </aside>
</div>

<dialog id="dlg">
  <h3>Merchant</h3>
  <label>Name<input id="dName" /></label>
  <label>Payout address<input id="dAddr" /></label>
  <button class="cta" id="dSave" style="width:100%">Save</button>
</dialog>

<script>
const MONADPAY = "0x0000000000000000000000000000000000000000";
const WS_URL = "wss://testnet-rpc.monad.xyz";
const PAID_TOPIC = "0xefb6650ea952a1f15b25c0abf0e65623721748fe689043ee32d4e74d79fbc25f";
const EXPLORER = "https://testnet.monadexplorer.com/tx/";

const $ = (id) => document.getElementById(id);
const store = (() => { try { return window.localStorage; } catch { return null; } })();
let merchant = {
  name: store?.getItem("tn.name") || "Tapnad Café",
  addr: store?.getItem("tn.addr") || "0x2bbf6125b26B771098836f981F0588A943641b6B",
};
let entry = "0";
let current = null;          // { invoice, amountWei, chargedAt }
const seen = new Map();       // invoice -> { states: {Proposed: t}, firstAt }

// ---------- helpers ----------
const pad32 = (hex) => "0x" + hex.replace(/^0x/, "").toLowerCase().padStart(64, "0");
const short = (a) => a.slice(0, 6) + "…" + a.slice(-4);
function toWei(s) {
  const [w, f = ""] = s.split(".");
  return BigInt(w || "0") * 10n ** 18n + BigInt((f + "0".repeat(18)).slice(0, 18));
}
function fmt(wei) {
  const w = wei / 10n ** 18n, f = (wei % 10n ** 18n).toString().padStart(18, "0").slice(0, 4).replace(/0+$/, "");
  return f ? `${w}.${f}` : `${w}`;
}
function randInvoice() {
  const b = new Uint8Array(32); crypto.getRandomValues(b);
  return "0x" + [...b].map((x) => x.toString(16).padStart(2, "0")).join("");
}
function decodePaid(log) {
  const d = log.data.slice(2);
  const amount = BigInt("0x" + d.slice(0, 64));
  const len = parseInt(d.slice(128, 192), 16);
  const bytes = d.slice(192, 192 + len * 2).match(/../g) || [];
  const memo = new TextDecoder().decode(new Uint8Array(bytes.map((h) => parseInt(h, 16))));
  return { invoice: log.topics[2], payer: "0x" + log.topics[3].slice(26), amount, memo, tx: log.transactionHash, block: parseInt(log.blockNumber, 16) };
}
function show(id) { document.querySelectorAll(".screen").forEach((s) => s.classList.toggle("on", s.id === id)); }
function chime() {
  try {
    const ctx = new AudioContext(), t = ctx.currentTime;
    [880, 1318.5].forEach((f, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = f; o.type = "sine";
      g.gain.setValueAtTime(0.0001, t + i * 0.12); g.gain.exponentialRampToValueAtTime(0.25, t + i * 0.12 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.12 + 0.5);
      o.connect(g).connect(ctx.destination); o.start(t + i * 0.12); o.stop(t + i * 0.12 + 0.55);
    });
  } catch {}
}

// ---------- keypad ----------
["1","2","3","4","5","6","7","8","9",".","0","⌫"].forEach((k) => {
  const b = document.createElement("button"); b.textContent = k;
  b.onclick = () => {
    if (k === "⌫") entry = entry.length > 1 ? entry.slice(0, -1) : "0";
    else if (k === ".") { if (!entry.includes(".")) entry += "."; }
    else entry = entry === "0" ? k : entry + k;
    if ((entry.split(".")[1] || "").length > 6) entry = entry.slice(0, -1);
    render();
  };
  $("pad").appendChild(b);
});
document.addEventListener("keydown", (e) => {
  if (!$("s-enter").classList.contains("on") || document.activeElement === $("memo")) return;
  const map = { Backspace: "⌫", Enter: null };
  if (e.key === "Enter") return $("charge").click();
  const k = map[e.key] ?? e.key;
  [...$("pad").children].find((b) => b.textContent === k)?.click();
});
function render() {
  $("amt").textContent = entry;
  $("charge").disabled = toWei(entry) === 0n;
  $("merchantLabel").textContent = `${merchant.name} · ${short(merchant.addr)} ✎`;
}

// ---------- charge ----------
$("charge").onclick = () => {
  current = { invoice: randInvoice(), amountWei: toWei(entry), chargedAt: performance.now() };
  const url = `monadpay://pay?to=${merchant.addr}&amount=${entry}&invoice=${current.invoice}` +
    `&name=${encodeURIComponent(merchant.name)}&memo=${encodeURIComponent($("memo").value)}`;
  const qr = qrcode(0, "M"); qr.addData(url); qr.make();
  $("qr").innerHTML = qr.createImgTag(6, 0);
  $("waitAmt").innerHTML = `${entry}<small>MON</small>`;
  show("s-wait");
};
$("cancel").onclick = () => { current = null; show("s-enter"); };
$("next").onclick = () => { current = null; entry = "0"; render(); show("s-enter"); };

// ---------- merchant settings ----------
$("merchantLabel").onclick = () => { $("dName").value = merchant.name; $("dAddr").value = merchant.addr; $("dlg").showModal(); };
$("dSave").onclick = () => {
  const a = $("dAddr").value.trim();
  if (!/^0x[0-9a-fA-F]{40}$/.test(a)) return alert("Invalid address");
  merchant = { name: $("dName").value.trim() || "Merchant", addr: a };
  try { store?.setItem("tn.name", merchant.name); store?.setItem("tn.addr", merchant.addr); } catch {}
  $("dlg").close(); render(); connect(true);
};

// ---------- success screen ----------
const STEPS = ["Proposed", "Voted", "Finalized"];
function paintTimeline(rec) {
  const base = rec.states.Proposed ?? Object.values(rec.states)[0];
  $("timeline").innerHTML = STEPS.map((s) => {
    const t = rec.states[s];
    const label = { Proposed: "Proposed — speculatively executed", Voted: "Voted — first round QC", Finalized: "Finalized — canonical" }[s];
    const ms = t == null ? "…" : (s === "Proposed" && rec.sinceCharge != null ? `${rec.sinceCharge} ms after tap` : `+${Math.round(t - base)} ms`);
    return `<div class="step ${t != null ? "on" : ""}"><span class="dot"></span>${label}<span class="ms">${ms}</span></div>`;
  }).join("") + `<div class="step"><a href="${EXPLORER}${rec.p.tx}" target="_blank" style="color:var(--purple)">Block ${rec.p.block} · view tx ↗</a></div>`;
}

function onPaid(log) {
  const p = decodePaid(log);
  const now = performance.now();
  let rec = seen.get(p.invoice);
  const isNew = !rec;
  if (!rec) { rec = { states: {}, p }; seen.set(p.invoice, rec); }
  // a block can skip straight to Finalized: backfill earlier steps with the same timestamp
  const idx = STEPS.indexOf(log.commitState);
  for (let i = 0; i <= idx; i++) if (rec.states[STEPS[i]] == null) rec.states[STEPS[i]] = now;

  if (isNew) {
    addFeed(p);
    // Show on screen if it's the active charge, or any tap while waiting (static NFC tags).
    if (current && (p.invoice.toLowerCase() === current.invoice.toLowerCase() || $("s-wait").classList.contains("on"))) {
      rec.sinceCharge = null;
      rec.onScreen = true;
      $("paidAmt").textContent = `${fmt(p.amount)} MON`;
      $("paidFrom").textContent = `${p.memo ? p.memo + " · " : ""}from ${short(p.payer)}`;
      show("s-paid"); chime();
    }
  }
  if (rec.onScreen) paintTimeline(rec);
}

function addFeed(p) {
  const el = document.createElement("div"); el.className = "tx";
  el.innerHTML = `<div>${p.memo || "Payment"}<div class="who">${short(p.payer)} · #${p.block}</div></div><b>+${fmt(p.amount)}</b>`;
  el.onclick = () => window.open(EXPLORER + p.tx, "_blank");
  $("feed").prepend(el);
}

// ---------- live blocks ----------
const blockRows = new Map(); let lastProposedAt = null; const bts = [];
function onHead(h) {
  const n = parseInt(h.number, 16);
  $("sBlock").textContent = n.toLocaleString();
  if (h.commitState === "Proposed") {
    const t = performance.now();
    if (lastProposedAt) { bts.push(t - lastProposedAt); if (bts.length > 20) bts.shift(); $("sBt").textContent = Math.round(bts.reduce((a, b) => a + b) / bts.length) + " ms"; }
    lastProposedAt = t;
  }
  let row = blockRows.get(h.blockId);
  if (!row) {
    row = document.createElement("div"); row.className = "blk"; blockRows.set(h.blockId, row);
    $("blocks").prepend(row);
    while ($("blocks").children.length > 8) { const last = $("blocks").lastChild; [...blockRows].forEach(([k, v]) => v === last && blockRows.delete(k)); last.remove(); }
  }
  row.innerHTML = `<span>#${n} · ${parseInt(h.gasUsed, 16).toLocaleString()} gas</span><span class="tag ${h.commitState}">${h.commitState}</span>`;
}

// ---------- websocket ----------
let ws, subs = {};
function connect(reset) {
  if (ws) { ws.onclose = null; ws.close(); }
  ws = new WebSocket(WS_URL);
  ws.onopen = () => {
    $("conn").className = "conn ok"; $("conn").innerHTML = "<i></i>Live · Monad testnet · monadLogs";
    ws.send(JSON.stringify({ jsonrpc: "2.0", id: 1, method: "eth_subscribe", params: ["monadNewHeads"] }));
    ws.send(JSON.stringify({ jsonrpc: "2.0", id: 2, method: "eth_subscribe",
      params: ["monadLogs", { address: MONADPAY, topics: [PAID_TOPIC, pad32(merchant.addr)] }] }));
  };
  ws.onmessage = (m) => {
    const msg = JSON.parse(m.data);
    if (msg.id) { subs[msg.result] = msg.id; return; }
    const r = msg.params?.result; if (!r) return;
    if (subs[msg.params.subscription] === 1) onHead(r);
    else if (subs[msg.params.subscription] === 2) onPaid(r);
  };
  ws.onclose = () => { $("conn").className = "conn"; $("conn").innerHTML = "<i></i>Reconnecting…"; setTimeout(() => connect(), 1000); };
}

render();
connect();
</script>
</body>
</html>
