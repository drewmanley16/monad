name: Tapnad
options:
  bundleIdPrefix: com.drewmanley
  createIntermediateGroups: true
packages:
  P256K:
    url: https://github.com/21-DOT-DEV/swift-secp256k1
    exactVersion: 0.21.1
  CryptoSwift:
    url: https://github.com/krzyzanowskim/CryptoSwift
    from: 1.8.4
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: X9H68STU8F
    CODE_SIGN_STYLE: Automatic
targets:
  Wallet:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources: [Wallet, Shared]
    dependencies:
      - package: P256K
        product: P256K
      - package: CryptoSwift
    info:
      path: Wallet/Info.plist
      properties:
        CFBundleDisplayName: Tapnad
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSBluetoothAlwaysUsageDescription: Tapnad uses Bluetooth to detect when you tap a register.
        NSLocalNetworkUsageDescription: Tapnad finds nearby registers on your network.
        NSBonjourServices: [_tapnad._tcp]
        NSFaceIDUsageDescription: Confirm payments with Face ID.
        CFBundleURLTypes:
          - CFBundleURLName: com.drewmanley.tapnad
            CFBundleURLSchemes: [monadpay]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.drewmanley.tapnad.wallet
        PRODUCT_NAME: Tapnad
        TARGETED_DEVICE_FAMILY: "1"
  POS:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources: [POS, Shared]
    dependencies:
      - package: P256K
        product: P256K
      - package: CryptoSwift
    info:
      path: POS/Info.plist
      properties:
        CFBundleDisplayName: Tapnad POS
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSBluetoothAlwaysUsageDescription: Tapnad POS uses Bluetooth so customers can tap to pay.
        NSLocalNetworkUsageDescription: Tapnad POS advertises charges to nearby phones.
        NSBonjourServices: [_tapnad._tcp]
        LSApplicationCategoryType: public.app-category.business
        CFBundleURLTypes:
          - CFBundleURLName: com.drewmanley.tapnad.pos
            CFBundleURLSchemes: [tapnadpos]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.drewmanley.tapnad.pos
        PRODUCT_NAME: Tapnad POS
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_IDENTITY: "-"
